[package]
name = "string-platform"
description = "String on Windows: one copy at a time, media keys, taskbar buttons, Discord, dark title bar, pickers, Recycle Bin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Discord's frames and the cover searches' answers; the covers file in its own order.
serde = "1"
serde_json = "1"
# Apple's and Deezer's cover searches (blocking, on a thread of their own).
ureq = "3"
# The window handle, from whichever toolkit made the window.
raw-window-handle = "0.6"
# Windows itself: Win32 for the window, shell and pipes; WinRT for the media overlay.
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
