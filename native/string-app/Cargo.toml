[package]
name = "string-app"
description = "String, the music player: the window and every screen, drawn with egui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "String"
path = "src/main.rs"

[dependencies]
string-core = { path = "../string-core" }
string-audio = { path = "../string-audio" }
string-lyrics = { path = "../string-lyrics" }
string-extras = { path = "../string-extras" }
string-platform = { path = "../string-platform" }
tempfile = "3"
eframe = "0.37"
egui = "0.37"
egui-wgpu = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_System_WinRT", "Win32_System_Com", "Win32_UI_Shell", "Storage_FileProperties", "Storage_Streams", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rand = "0"
crossbeam-channel = "0"
fast_image_resize = "*"
