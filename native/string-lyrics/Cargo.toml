[package]
name = "string-lyrics"
description = "Lyrics for the song playing (.lrc, the song's own, LRCLIB) and their translation by a local model through Ollama"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
string-http = { path = "../string-http" }
string-core = { path = "../string-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
thiserror = "2"
sha2 = "0"
chrono = "0.4"
tempfile = "3"
