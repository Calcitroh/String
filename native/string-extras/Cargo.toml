[package]
name = "string-extras"
description = "Duplicates, Edit info (tag writing), phone listening from Navidrome, and String's own updates"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enables the local release fixture in application-level integration tests.
test-feed = []

[dependencies]
string-http = { path = "../string-http" }
string-core = { path = "../string-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0"
rusqlite = { version = "0", features = ["bundled"] }
p256 = { version = "0", features = ["ecdsa", "pkcs8"] }
sha2 = "0"
base64 = "0"
zip = { version = "*", default-features = false, features = ["deflate"] }
ureq = { version = "3", features = ["json"] }
thiserror = "2"
chrono = "0.4"
tempfile = "3"
